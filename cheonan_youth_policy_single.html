function populate(){const s=slides[current];sideTitle.textContent=s.title;sideSubtitle.textContent=s.subtitle;currentNum.textContent=String(current+1).padStart(2,'0');progress.style.width=`${(current+1)/slides.length*100}%`;quickPoints.replaceChildren();s.items.forEach(([name,description],i)=>{const row=elem('div','point'),idx=elem('span','point-index',String(i+1).padStart(2,'0')),content=elem('div','point-content'),title=elem('strong','',name),desc=elem('small','',description);content.append(title,desc);row.append(idx,content);quickPoints.append(row);});hotspots.replaceChildren();$('#stageHint').classList.toggle('visible',s.hotspots.length>0);s.hotspots.forEach(i=>{const button=elem('button','hotspot');button.type='button';button.style.left=`${8.2+ i*29.65}%`;button.style.top='37.1%';button.style.width='27.2%';button.style.height='47.5%';button.setAttribute('aria-label',`${s.items[i][0]} 자세히 보기`);button.title=`${s.items[i][0]} — 자세히 보기`;button.addEventListener('click',()=>openDetails(i));hotspots.append(button);});document.querySelectorAll('.slide-tab').forEach((b,i)=>{b.classList.toggle('active',i===current);b.setAttribute('aria-current',i===current?'step':'false')});document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active',Math.abs((Number(b.dataset.jump)-1)-current)<=((Number(b.dataset.jump)===2)?2:(Number(b.dataset.jump)===5)?3:0)));$('#prevBtn').disabled=current===0;$('#nextBtn').disabled=current===slides.length-1;history.replaceState(null,'',`#slide-${current+1}`);document.title=`${s.title.replace('\n',' ')} | 천안시 청년정책 2026`;}
function goTo(index){if(index<0||index>=slides.length||index===current||animating)return;animating=true;const direction=index>current?1:-1;stage.style.setProperty('--slide-dir',`${direction*38}px`);image.classList.remove('entering');image.classList.add('exiting');clearTimeout(transitionTimer);transitionTimer=setTimeout(()=>{current=index;image.src=embeddedSlides[current];image.alt=`슬라이드 ${current+1}. ${slides[current].title.replace('\n',' ')}. ${slides[current].subtitle}. ${slides[current].items.map(x=>x.join(': ')).join('. ')}. ${slides[current].foot}`;populate();image.classList.remove('exiting');void image.offsetWidth;image.classList.add('entering');animating=false;},200);}
function openOverlay(node){node.classList.add('open');node.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');const btn=node.querySelector('.close-btn');if(btn)btn.focus();}
function closeOverlay(node){node.classList.remove('open');node.setAttribute('aria-hidden','true');if(!document.querySelector('.overlay.open'))document.body.classList.remove('modal-open');}
function openDetails(highlight=-1){const s=slides[current];detailTitle.textContent=s.title.replace('\n',' ');detailSubtitle.textContent=s.subtitle;detailItems.replaceChildren();s.items.forEach(([name,description],i)=>{const card=elem('div','detail-item');if(i===highlight){card.style.background='#e8f5fe';card.style.boxShadow='0 0 0 2px #78aef0';}card.append(elem('strong','',name),elem('p','',description));detailItems.append(card);});detailFootnote.textContent=s.foot;openOverlay(details);if(highlight>=0){const target=detailItems.children[highlight];target.scrollIntoView({block:'nearest',behavior:'smooth'});}}
slides.forEach((slide,i)=>{const tab=elem('button','slide-tab');tab.type='button';tab.title=`${i+1}. ${slide.title.replace('\n',' ')}`;tab.setAttribute('aria-label',`${i+1}번 슬라이드: ${slide.title.replace('\n',' ')}`);tab.addEventListener('click',()=>goTo(i));$('#slideTabs').append(tab);const card=elem('button','overview-card');card.type='button';const thumbnail=elem('img');thumbnail.src=embeddedSlides[i];thumbnail.alt='';thumbnail.loading='lazy';card.append(thumbnail,elem('span','',`${String(i+1).padStart(2,'0')} / ${slide.title.replace('\n',' ')}`));card.addEventListener('click',()=>{closeOverlay(overview);goTo(i)});overviewGrid.append(card);});
$('#prevBtn').addEventListener('click',()=>goTo(current-1));$('#nextBtn').addEventListener('click',()=>goTo(current+1));$('#overviewBtn').addEventListener('click',()=>{[...overviewGrid.children].forEach((c,i)=>c.classList.toggle('selected',i===current));openOverlay(overview)});$('#detailBtn').addEventListener('click',()=>openDetails());$('#textOpenBtn').addEventListener('click',()=>openDetails());document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>goTo(Number(b.dataset.jump)-1)));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeOverlay(document.getElementById(b.dataset.close))));[overview,details].forEach(modal=>modal.addEventListener('click',e=>{if(e.target===modal)closeOverlay(modal)}));
function toggleFullscreen(){if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return;}if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>document.body.classList.toggle('fullscreen'));}else document.body.classList.toggle('fullscreen');}
$('#fullscreenBtn').addEventListener('click',toggleFullscreen);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOverlay(overview);closeOverlay(details);return;}if(document.querySelector('.overlay.open'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){if(e.target.matches('button,input,textarea'))return;e.preventDefault();goTo(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goTo(current-1)}if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey)toggleFullscreen();if(e.key.toLowerCase()==='g'&&!e.ctrlKey&&!e.metaKey)$('#overviewBtn').click();});
window.addEventListener('wheel',e=>{if(document.querySelector('.overlay.open')||Math.abs(e.deltaY)<25||window.innerWidth<981)return;if(Date.now()-lastWheel<850)return;lastWheel=Date.now();goTo(current+(e.deltaY>0?1:-1));},{passive:true});
stage.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});stage.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)goTo(current+(dx<0?1:-1));touchStart=null;},{passive:true});
window.addEventListener('hashchange',()=>{const matched=location.hash.match(/^#slide-(\d+)$/);if(matched)goTo(Math.max(0,Math.min(slides.length-1,Number(matched[1])-1)));});
const start=location.hash.match(/^#slide-(\d+)$/);if(start)current=Math.max(0,Math.min(slides.length-1,Number(start[1])-1));image.src=embeddedSlides[current];image.alt=`슬라이드 ${current+1}. ${slides[current].title.replace('\n',' ')}. ${slides[current].subtitle}`;populate();slides.forEach((_,i)=>{if(i===current)return;const img=new Image();img.src=embeddedSlides[i];});

</script>
</body>
</html>
